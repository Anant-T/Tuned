# law_v1 dataset-curation build config. This file is churn-heavy (API
# providers/models/limits change weekly) so it lives separately from the
# training config and only ever REFERENCES it (build.train_config) for
# anything the trainer owns - think tags, tokenizer pin, dataset path.
# Never duplicate those values here; src/tuned/data/config.py resolves them
# from the referenced training config at load time.

build:
  train_config: configs/law_v1_8b_ddp.yaml
  workdir: data/build
  target_total: 18000
  mvp_total: 10300
  mix: {grounded_synthesis: 0.60, curated: 0.16, replay: 0.24}
  overgeneration: 2.0
  held_out_frac: 0.10
  length_band: {total_max: 8192, total_min: 300, think_min: 500, think_max: 3000, answer_min: 120}
  difficulty_target: {easy: 0.34, medium: 0.50, hard: 0.16}
  appointed_day: "2024-07-01"

providers:
  - name: cerebras
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    quirks: [cerebras]
    models:
      - id: gpt-oss-120b
        family: gpt-oss
        roles: [generator]
        limits: {rpm: 5, tpm: 30000, tpd: 1000000, max_context: 8192, max_output: 4096}
        params: {temperature: 0.7, top_p: 0.95, reasoning_effort: medium}
      - id: zai-glm-4.7
        family: glm
        roles: [judge, tiebreak]
        limits: {rpm: 5, tpm: 30000, tpd: 1000000, max_context: 8192, max_output: 4096}
        params: {temperature: 0.2}
      - id: gemma-4-31b
        family: gemma
        roles: [tiebreak]
        limits: {rpm: 5, tpm: 30000, tpd: 1000000, max_context: 8192, max_output: 4096}
        params: {temperature: 0.2}
  - name: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    quirks: [groq]
    models:
      - id: qwen/qwen3.6-27b
        family: qwen
        roles: [judge]
        limits: {rpm: 30, tpm: 6000, tpd: 200000, rpd: 1000, max_context: 131072, max_output: 16384}
        params: {temperature: 0.2}
      - id: openai/gpt-oss-20b
        family: gpt-oss
        roles: [tiebreak]
        limits: {rpm: 30, tpm: 8000, tpd: 200000, rpd: 1000, max_context: 131072, max_output: 65536}
        params: {temperature: 0.2}
      - id: llama-3.1-8b-instant
        family: llama
        roles: [probe]
        limits: {rpm: 30, tpm: 6000, tpd: 500000, rpd: 14400, max_context: 131072, max_output: 32768}
        params: {temperature: 0.6}
  - name: mistral
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    quirks: [mistral]
    models:
      - id: magistral-small-latest
        family: mistral
        roles: [generator]
        limits: {rpm: 25, tpm: 25000, tpd: 33000000, max_context: 40000, max_output: 8192}
        params: {temperature: 0.7, top_p: 0.95}
      - id: mistral-small-latest
        family: mistral
        roles: [judge]
        limits: {rpm: 25, tpm: 25000, tpd: 33000000, max_context: 32000, max_output: 8192}
        params: {temperature: 0.2}
  - name: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    quirks: [openai]
    models:
      # Both are declared family gpt-oss, which is NOT what the model card
      # says: it is a deliberate, conservative lump so that OpenAI never
      # grades its own lab's gpt-oss-120b rows. Family separation is what
      # keeps a judge honest about a generator, and the cheap direction to
      # be wrong in is "too separate".
      #
      # Neither block carries `temperature`: the gpt-5 family accepts the
      # default and 400s on any other value (measured 2026-08-15). The
      # `openai` quirk in providers.py drops it from the payload regardless,
      # because judge.py sends its own per-call temperature and that would
      # otherwise arrive here through build_payload.
      #
      # NO tpd on either block, and that is a decision rather than an
      # omission: operator's call 2026-08-15, this provider runs UNCAPPED. An
      # absent cap reads as unlimited (store._cap treats a missing key as
      # infinity), the same way the cerebras blocks leave rpd absent. The
      # rpm/tpm below are real RATE limits - OpenAI's actual tier limits - and
      # not spend controls, so nothing in this file brakes spend. Any spend
      # brake lives server-side in the OpenAI billing dashboard, where a
      # config edit cannot remove it. Uncapped is not the same as preferred:
      # both refs sit LAST in routing.judge and routing.tiebreak, so every
      # free judge is tried first and these are reached only by rows nothing
      # free can serve.
      - id: gpt-5-mini
        family: gpt-oss
        roles: [judge, tiebreak]
        limits: {rpm: 500, tpm: 200000, max_context: 400000, max_output: 16384}
        params: {}
      - id: gpt-5-nano
        family: gpt-oss
        roles: [judge, tiebreak]
        # The calibration candidate: ~5x cheaper than mini, and carried here
        # so the P5 gate can compare the two on real judgments rather than on
        # price alone.
        limits: {rpm: 500, tpm: 200000, max_context: 400000, max_output: 16384}
        params: {}

# Mistral rpm/tpm are console+header-verified 2026-08-14 and are no longer
# placeholders. The workspace limit is 50 rpm / 50k tpm and BOTH models draw
# on the ONE bucket: the remaining-tokens header decremented continuously
# across calls made with different models (50000 -> 49983 -> 49966), so the
# bucket is per WORKSPACE, not per model. providers.TokenBucket is per
# (provider, model), so each model is given half - two per-model buckets of
# 50k would issue at twice the real refill rate and 429-storm at full load.
# Cerebras tpd may actually be account-wide shared rather than per-model;
# treated per-model here until it is empirically tested. qwen/qwen3.6-27b is
# a Groq PREVIEW model and may vanish without notice - never make it the sole
# judge; the routing lists below always give fallbacks. Model refs in routing
# are "provider/model-id" strings - note that "groq/qwen/qwen3.6-27b" contains
# TWO slashes, so refs are split on the FIRST slash only (provider="groq",
# model="qwen/qwen3.6-27b").
#
# CLOSED 2026-08-15. This block used to be a TODO(operator) demanding ONE
# more judge model in a fourth family, which the fleet refused to start
# without. That model is the openai provider above, and the gap is read as
# closed out of the real preflight - generate.print_preflight over
# providers.pool_gaps, every key present - rather than argued from the config:
# with OPENAI_API_KEY set there are NO fatal gaps left, only the survivable
# tiebreak warnings described at the bottom of this block. It went into BOTH
# routing.judge and routing.tiebreak, LAST in each, because it is the paid
# backstop: every free judge is preferred to it, so the ~$1/day cap is only
# ever spent on rows nothing free can serve.
#
# What made it qualify, and the bar any replacement must clear:
# max_context >= 29661. That is not a round number because it is not a
# preference - it is required_context(worst-case judge call), and the
# preflight prints the same number it enforces. In practice that means a 32k
# model. A 16k model is NOT enough - and that is worth saying because most
# free-tier candidates are 16k, and an under-sized judge does not fail
# loudly: the fleet starts, long rows pass the length gate, judge A is paid
# for, and the row parks. gpt-5-mini and gpt-5-nano declare 400k.
#
# Where the number comes from. The length gate passes a row whose prompt +
# trace + answer is at most 8192 chars/4 tokens, i.e. 32,768 characters, and
# the judge is shown a subset of that plus its own rubric. Sized in the
# ROUTING currency (providers.context_estimate: per-turn template overhead,
# and Indic script at 1.5 chars/token rather than 4) the largest judge call
# this build can produce is 23,729 tokens, and CONTEXT_SAFETY_MARGIN turns
# that into 29,661 of declared window. Devanagari is what makes it large,
# and this corpus is largely Devanagari.
#
# What the fatal gap WAS, kept because any future edit to routing.judge can
# re-open it. A long prompt is routed past the 8k cerebras generator to
# mistral/magistral (40k). Family separation then removes mistral from the
# judge pool; the 8k zai-glm-4.7 is removed on context length; slot A takes
# groq/qwen; and slot B had NOTHING LEFT. The row parked in judge_unroutable
# having ALREADY PAID for judge A. The arithmetic made this the rule and not
# an edge case: the generator diverts to magistral at 2,555 routing tokens of
# prompt, and slot B died at 5,531 routing tokens of judge prompt - which
# grounding plus a trace near think_max (3000) clears routinely. Slot B is
# now openai/gpt-5-mini.
#
# Recovery for rows that parked before this landed: `python -m
# tuned.data.tasks --reopen judge_unroutable` (every stream by default;
# --reopen-stream narrows it). A re-opened row re-pays only the slot it never
# bought, and comes back with its attempt budget restored.
#
# What is LEFT, and only warns. The TIEBREAK pool cannot serve a long row
# from EITHER generator family, and closing the judge gap made the second of
# those visible rather than causing it: pool_gaps stops walking a generator
# family at its first fatal judge gap, so the mistral case was never reached
# before. For a gpt-oss generation, separation removes every gpt-oss tiebreak
# - the groq 20b and both openai models, which are lumped into that family on
# purpose - and the context check removes gemma and glm. For a mistral
# generation, the two judge slots take qwen and gpt-oss, which leaves the
# tiebreak with no family it has not already spent. In both cases judge.py
# decides on the two judges it has and rejects the unresolved disagreement
# (run_event tiebreak_unroutable_two_judge_decision - the metric to watch).
#
# Closing THAT would take one more tiebreak in a family that is none of
# gpt-oss/mistral/qwen/gemma/glm, with max_context >= 29666. The five over
# the judge threshold are real and not a typo: the tiebreak prompt is a
# little longer than the judge prompt and the preflight sizes the two
# separately, so 29,661 buys a judge and 29,666 buys a tiebreak.
#
# NOT an option: letting a judge share the generator's family when the pool
# runs out. Family separation is a data-quality invariant, not a preference.
routing:
  generator: [cerebras/gpt-oss-120b, mistral/magistral-small-latest]
  judge: [mistral/mistral-small-latest, groq/qwen/qwen3.6-27b, cerebras/zai-glm-4.7,
          openai/gpt-5-mini, openai/gpt-5-nano]
  tiebreak: [groq/openai/gpt-oss-20b, cerebras/gemma-4-31b, cerebras/zai-glm-4.7,
             openai/gpt-5-mini, openai/gpt-5-nano]
  probe: [groq/llama-3.1-8b-instant]
  family_separation: true
  judge_mode: dual        # dual | audit
