# ARCHIVED - DISQUALIFIED ON T4 (2026-08-06). Do not train on Kaggle.
# Ministral-3-14B OOMs at step 0 in unsloth's fused CE loss at ANY sequence
# length: torch._dynamo fails to trace the fused path, and the eager functorch
# fallback materializes a seq-invariant 1.25 GiB fp16 lm_head copy on top of a
# 13.5 GiB baseline (untied embed+lm_head cost ~2.5 GB extra). Details in
# docs/ministral-t4-disqualification.md. Kept for the vision-tower LoRA regex
# and marker reference; hub repo is null so sft.py refuses to run it without
# an explicit --no-hub.
model:
  repo: unsloth/Ministral-3-14B-Reasoning-2512-unsloth-bnb-4bit
  revision: ec1befbd41647354531b2e09bd036cd1dc94b076
  # Completion-masking markers, verified against this revision's chat_template.jinja:
  # user turns render as [INST]...[/INST], the assistant reply follows [/INST].
  instruction_part: '[INST]'
  response_part: '[/INST]'

data:
  # Ministral Reasoning's native scaffold; the smoke builder wraps traces in these.
  think_open: '[THINK]'
  think_close: '[/THINK]'

lora:
  r: 32
  alpha: 32
  dropout: 0.0
  # Regex, not a list: scoped to language_model so the vision tower never gets
  # LoRA modules (works around unsloth#5677 LoRA-save failure). Single quotes required.
  # PEFT applies string patterns with re.fullmatch against full module paths, which
  # carry a leading "model." component - hence the optional prefix group.
  target_modules: '(?:.*\.)?language_model\..*\.(?:q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)'

train:
  seed: 3407
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.001
  optim: adamw_8bit
  lr_scheduler_type: linear
  smoke:
    max_seq_length: 2048
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 16
    max_steps: 60
    save_steps: 25
    dataset: data/smoke_v1.jsonl

hub:
  checkpoint_repo: null   # disqualified config must never push checkpoints
