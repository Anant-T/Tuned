# Remote dataset-build worker: generate + audit-judge on a cron baton.
#
# State (SQLite snapshot + raw NDJSON + streams) lives in a PRIVATE HF
# dataset repo; each run restores it, works ~5.25h, and pushes it back
# (and every 15 min in between). The concurrency group is the fence that
# keeps two runs from ever working the baton at once - the generator's
# rate bucket is account-level, so exactly ONE generating host may exist.
#
# The default GITHUB_TOKEN cannot trigger workflow runs, so the chain is
# cron, not self-dispatch. Logs on a public repo are PUBLIC: no step may
# echo the environment.
name: data-worker

on:
  schedule:
    # Every 4 hours, not 6. A run is ~322-327 min end to end (--minutes 315
    # plus the pull, the pushes and job setup), so at */6 the machine sat
    # idle for over half an hour out of every six, four times a day. Any
    # period BELOW the cycle chains instead: the data-build group holds one
    # run and one pending run, so the next is already queued when the current
    # one finishes.
    #
    # */4 rather than */3 because of what the group does with a SECOND
    # pending trigger - it replaces the one already waiting. At 240 min the
    # queued run starts ~80 min before the next cron fires, so nothing is
    # ever displaced; at 180 it would be, once per cycle, and the thing
    # displaced could be an operator's data-assemble dispatch.
    #
    # --minutes stays at 315. Raising it buys ~1.4pp of utilisation and
    # halves the margin against timeout-minutes below, which is the wrong
    # trade for an unattended job whose failure mode is losing the work since
    # its last checkpoint.
    #
    # TWO fires per window, not one, because GitHub delivers them HOURS late
    # here. On 2026-08-31 this schedule was due at 00:17, 04:17, 08:17 and
    # 12:17Z; by 16:00Z it had produced one run, the 04:17 fire 85 minutes
    # late. The 12:17 fire then arrived at 16:11:34Z - 3 h 54 m late, and
    # provably not an early 16:17 fire, since GitHub delays fires but never
    # advances them. On a four-hour cadence a fire that late has already been
    # overtaken by the next one, so the practical effect is the same as a drop:
    # a window in which an unattended build is stalled and nobody is watching.
    # The fence makes the retry free - a second trigger 30 min later either
    # finds the slot taken and replaces a pending run with an identical one, or
    # delivers the fire the first one lost. It cannot make lateness worse: the
    # concurrency group admits one pending run whatever arrives.
    # Neither is at the top of the hour, which is the load peak GitHub names.
    - cron: "17 */4 * * *"
    - cron: "47 */4 * * *"
  workflow_dispatch: {}

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  worker:
    if: github.repository == 'Anant-T/Tuned'
    runs-on: ubuntu-latest
    # 350 = the argparse --minutes default (315) plus headroom for the
    # baton pull, the final push and job setup. The two numbers constrain
    # each other, so they are commented together - and --minutes is NOT
    # restated on the run line below: one default, in one place.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache-dependency-path is REQUIRED here, not decoration: `cache: pip`
          # defaults to hashing requirements*.txt, this repo has none, and the
          # step FAILS with "unable to cache dependencies" rather than skipping
          # the cache. Keyed on pyproject.toml, so editing an extra invalidates.
          cache: pip
          cache-dependency-path: pyproject.toml
      # [build-worker], NOT [build]: this job runs reconcile, generate and
      # judge, whose whole third-party closure is httpx + huggingface_hub.
      # The seven it used to resolve on every unattended run - datasets,
      # pyarrow, boto3, semhash and its embedding stack, pymupdf4llm,
      # transformers - are the assemble chain's, and pyproject keeps this a
      # subset of [build] under test.
      - name: Install
        run: pip install -e ".[build-worker]"
      - name: Run the worker
        env:
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # gemma answers 402 at completion time but its ref is still routed;
          # the preflight checks the KEY, so it must be present.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >
          python data/scripts/actions_worker.py --phase worker
          --hf-repo tantan01/tuned-law-state
