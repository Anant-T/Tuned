# Assembly of the shipped dataset from the bundle repo's current state:
# verify -> decontaminate -> dedupe -> split -> assemble -> stats, then
# push.py only if stats is green. Dispatched by the operator (browser or
# phone); shares the data-build concurrency group so it serializes against
# a running worker instead of racing it for the baton.
name: data-assemble

on:
  workflow_dispatch: {}

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  assemble:
    if: github.repository == 'Anant-T/Tuned'
    runs-on: ubuntu-latest
    # 240, not 120. The chain at the 18k target was measured at 270-358 min
    # before this pass and lands at 75-100 after it, so 120 was under the old
    # ceiling and is comfortably over the new one - but the estimate is an
    # estimate, and a chain killed at the cap loses the whole run's work
    # while a chain that finishes early costs nothing. It stays a real bound:
    # a hang still gets cut, four hours in rather than two.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache-dependency-path is REQUIRED here, not decoration: `cache: pip`
          # defaults to hashing requirements*.txt, this repo has none, and the
          # step FAILS with "unable to cache dependencies" rather than skipping
          # the cache. Keyed on pyproject.toml, so editing an extra invalidates.
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[build]"
      # The chain's tokenizer users (assemble, stats) import transformers
      # lazily, so a missing dep surfaced ~90 min in, at step 5 of 6, after
      # verify/decontaminate/dedupe/split had already run. Fail in 2 s instead.
      - name: Check the chain's imports resolve
        run: python -c "import transformers, tuned.data.assemble, tuned.data.stats"
      - name: Assemble and push
        env:
          BAI_API_KEY: ${{ secrets.BAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >
          python data/scripts/actions_worker.py --phase assemble
          --hf-repo tantan01/tuned-law-state
