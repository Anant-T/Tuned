[project]
name = "tuned"
description = "QLoRA fine-tuning of Qwen3-8B on Kaggle free-tier GPUs (2x T4, DDP)."
requires-python = ">=3.12"  # unsloth supports >=3.9,<3.15
dynamic = ["version"]
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version - bumping __init__.py is enough.
[tool.hatch.version]
path = "src/tuned/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tuned"]

# The one marker the suite defines. Registered here rather than in a
# conftest hook so `--strict-markers` remains available without a code
# change, and so the network guard's escape hatch is declared where the
# rest of the project's configuration lives.
[tool.pytest.ini_options]
markers = ["live: this test is allowed to use the network"]

[project.optional-dependencies]
dev = ["pytest>=8"]

# What the UNATTENDED CRON installs, and nothing else. data-worker.yml runs
# every few hours with no human present, and it runs exactly three modules:
# reconcile, generate and judge. Their transitive third-party closure is
# httpx (the provider client), huggingface_hub (the baton, via
# actions_worker's Bundle) and pyyaml, which is a base dependency. `datasets`
# appears in that closure ONLY inside replay._stream and
# citations._stream_kanoongpt - lazy corpus-streaming functions the worker
# never reaches, because gates.py imports the pure predicates beside them.
#
# So the cron resolved seven libraries it could not use, including semhash's
# embedding stack and a transformers pin, on every run. Splitting them out
# is not only speed: an unattended job that installs less has less that can
# fail to resolve while nobody is watching.
#
# This list must stay a SUBSET of [build] - the assemble phase runs the
# worker's modules too - and test_pins.py asserts that rather than trusting
# the two lists to be edited together.
build-worker = [
    "httpx>=0.27",
    "huggingface_hub",
]

# The full curation stack: the assemble chain, plus the corpus builders the
# operator runs by hand. Deliberately UNPINNED except where a version is
# correctness (below), and never installed on Kaggle - the trainer imports
# none of it, and pinning here would drag heavyweight resolves into the
# training env.
#
# "The build runs locally" used to be the reason the resolve could drift
# freely. It is no longer true and has not been since 2026-08-29: the build
# runs on GitHub Actions, unattended, and data-assemble.yml resolves this
# whole list on a cold runner. The exposure is named rather than fixed here -
# `cache: pip` keyed on this file reuses the wheels a previous run downloaded,
# which is not a pin (a fresh upstream release is still picked up on a cache
# miss), and a real lockfile is a separate decision nobody has made yet.
build = [
    "httpx>=0.27",
    "datasets",
    "pyarrow",
    # NO datasketch: dedupe.py's candidate generator is an exact prefix-filter
    # index, not MinHashLSH, and nothing in the tree imports it.
    "semhash",
    "pymupdf4llm",
    "huggingface_hub",
    # PINNED TO THE SAME VERSION AS [train], and the pin is correctness rather
    # than hygiene. assemble.py and stats.py load the tokenizer to measure
    # token_length against max_seq_length; a tokenizer built by a different
    # transformers version measures a different length than the trainer will,
    # so the builder would drop (or keep) rows the trainer disagrees about.
    # test_pins.py asserts the two extras carry the same pin.
    #
    # Its ABSENCE was a hard blocker: the data-assemble chain ran
    # verify -> shape -> decontaminate -> dedupe -> split and then died with
    # ModuleNotFoundError inside `tuned.data.assemble` (load_tokenizer, which
    # imports transformers lazily), so push.py never ran and CI had never
    # produced a dataset. transformers pulls no torch, so this costs ~15 MB.
    "transformers==5.5.0",
]

# The public AWS judgment bucket, and only that. acquire.py imports boto3
# lazily inside the S3 seam with its own message, so every other kind -
# including the `--kind hf` eval-set fetch data-assemble.yml runs before the
# chain - works without it. It sat in [build] costing both CI jobs a
# botocore resolve for a code path neither of them takes.
acquire-s3 = ["boto3"]

train = [
    # Pinned: the resolver silently bumped unsloth 2026.8.3 -> 2026.8.4 between
    # otherwise-identical Kaggle runs. Every training dep that can drift is fixed.
    "unsloth==2026.8.3",
    "unsloth_zoo==2026.8.3",
    "transformers==5.5.0",
    "trl==0.24.0",
    # peft: the #5677 regex mitigation rides on peft's re.fullmatch semantics;
    # bitsandbytes: a broken bnb flips ALLOW_PREQUANTIZED_MODELS and silently
    # drops the pinned model revision. Values = what uv.lock resolved 2026-08-04.
    "peft==0.20.0",
    "bitsandbytes==0.50.0",
    "datasets",
    "huggingface_hub",
    "hf_transfer",
]
