[project]
name = "tuned"
description = "Multi-adapter fine-tuning of Gemma 4 31B on Lightning.ai."
requires-python = ">=3.12"  # unsloth supports >=3.9,<3.15
dynamic = ["version"]
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version - bumping __init__.py is enough.
[tool.hatch.version]
path = "src/tuned/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tuned"]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = [
    "unsloth>=2026.8.2",
    "transformers==5.5.0",
    "trl",
    "datasets",
    "huggingface_hub",
]
