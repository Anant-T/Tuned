[project]
name = "tuned"
description = "Multi-adapter fine-tuning of Ministral-3-14B-Reasoning on Kaggle free-tier GPUs."
requires-python = ">=3.12"  # unsloth supports >=3.9,<3.15
dynamic = ["version"]
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version - bumping __init__.py is enough.
[tool.hatch.version]
path = "src/tuned/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tuned"]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = [
    # Pinned: the resolver silently bumped unsloth 2026.8.3 -> 2026.8.4 between
    # otherwise-identical Kaggle runs. Every training dep that can drift is fixed.
    "unsloth==2026.8.3",
    "unsloth_zoo==2026.8.3",
    "transformers==5.5.0",
    "trl==0.24.0",
    "datasets",
    "huggingface_hub",
    "hf_transfer",
]
