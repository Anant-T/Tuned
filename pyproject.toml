[project]
name = "tuned"
description = "QLoRA fine-tuning of Qwen3-8B on Kaggle free-tier GPUs (2x T4, DDP)."
requires-python = ">=3.12"  # unsloth supports >=3.9,<3.15
dynamic = ["version"]
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version - bumping __init__.py is enough.
[tool.hatch.version]
path = "src/tuned/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tuned"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Dataset-curation deps. Deliberately UNPINNED and never installed on Kaggle:
# the build runs locally, the trainer never imports any of this, and pinning
# here would drag heavyweight resolves into the training env.
build = [
    "httpx>=0.27",
    "datasets",
    "pyarrow",
    "boto3",
    # NO datasketch: dedupe.py's candidate generator is an exact prefix-filter
    # index, not MinHashLSH, and nothing in the tree imports it.
    "semhash",
    "pymupdf4llm",
    "huggingface_hub",
    "openai-harmony",
]
train = [
    # Pinned: the resolver silently bumped unsloth 2026.8.3 -> 2026.8.4 between
    # otherwise-identical Kaggle runs. Every training dep that can drift is fixed.
    "unsloth==2026.8.3",
    "unsloth_zoo==2026.8.3",
    "transformers==5.5.0",
    "trl==0.24.0",
    # peft: the #5677 regex mitigation rides on peft's re.fullmatch semantics;
    # bitsandbytes: a broken bnb flips ALLOW_PREQUANTIZED_MODELS and silently
    # drops the pinned model revision. Values = what uv.lock resolved 2026-08-04.
    "peft==0.20.0",
    "bitsandbytes==0.50.0",
    "datasets",
    "huggingface_hub",
    "hf_transfer",
]
