# 8B DDP lane - Qwen3-8B under plain 2x T4 data-parallel via torchrun.
# Seq 12288 was tried on 2026-08-26 and FAILED: rank 1 OOM'd inside step 0's
# backward, ~14.3 GiB reserved against the 13.5 GiB abort line - roughly
# 0.8 GiB over, already at UNSLOTH_CE_LOSS_N_CHUNKS=32 on the dynamic-4bit
# repo. Not marginal; do not re-raise without spending an OOM-ladder rung
# first. The cap is back at 8192, where this lane is qualified.
#
# The production lane, FULLY QUALIFIED on Kaggle 2026-08-08 - all four gates
# green: PROBE (per-rank peaks 12.80/13.00 GiB), SAVETEST (checkpoint pushed
# and visible on the Hub), SMOKE (60/60 steps, 74.7 s/step, train_loss 0.5722
# trending down, peaks 12.98/13.18 GiB vs 14.56 GiB usable), RESUME (fresh
# session, resumed at step 61 with scaler state restored). Dynamic 4-bit
# weights measured 6.97 GiB (repo total_size, NOT params/2 - the naive halving
# estimate under-counts quantization overhead).
# Chunked cross-entropy is confirmed active on this stack: measured peaks stay
# ~1.4 GiB under the cap at seq 8192, which only holds if logits never
# materialize in full. Precision (unsloth source read
# 2026-08-07): the active path is unsloth's own chunked fused CE
# (unsloth_fused_ce_loss) - Apple's cut-cross-entropy is dead code on sm_75
# (commented out upstream; its Triton kernels need 96KB shared mem vs T4's
# 64KB). Default chunking (n_chunks=4 at this seq/vocab) leaves a ~2.4-3.0
# GiB transient at the loss step; the notebook now sets UNSLOTH_CE_LOSS_N_CHUNKS=32
# (must be in env before `import unsloth`). The measured peaks above were taken
# at 16 on 2026-08-08, cutting that transient to ~0.7 GiB - that margin is what
# those numbers depend on; 32 was spent later (2026-08-26) as an OOM-ladder
# rung, its own margin unmeasured.
# Each rank holds the FULL model (no model split) - the parallelism is over
# data, not layers. Launch:
#
#   CUDA_VISIBLE_DEVICES=0,1 torchrun --nproc_per_node=2 -m tuned.train.sft \
#       --config training/configs/law_v1_8b_ddp.yaml --mode smoke
#
# ga=2: at 8B the per-token memory footprint is small enough to spend the
# budget on sequence length rather than throughput. 8192 x 1 x 2 x 2 ranks =
# 32,768 tokens/optimizer-step is the CEILING, not the batch - at bs=1 the
# collator pads to the longest row in the batch (= the row itself), so real
# tokens/step follow row length and stay ~30k. The LAW corpus tops out at
# 7,610 tokens (p100 across 5,420 rows), bounded by chunks.py's
# MAX_CHUNK_TOKENS = 1500 rather than by this cap. data/smoke_v1.jsonl is
# NOT so bounded - smoke.py applies no length filter, so its OpenThoughts
# rows truncate to whatever this number is, and it is SMOKE, not MAIN, that
# sets the real memory ceiling. That is what the 12288 attempt got wrong.
#
# Step-0 gate (mandatory before trusting any loss/grad_norm number out of this
# lane): assert non-zero assistant-label coverage. unsloth#2771 / trl#3927 -
# truncation at long seq can silently produce an all -100 label row, which
# trains on nothing while looking green.
#
# OOM fallback ladder, in order:
#   1. swap model.repo to unsloth/Qwen3-8B-bnb-4bit (standard quant, not the
#      "-unsloth-" dynamic quant) - saves exactly 1.31 GiB; re-pin revision
#      via training/scripts/pin_revision.py before using it, do not guess a sha.
#   2. drop max_seq_length to 6144 (still keeps most judgments intact - the
#      corpus p50 is 2,438 tokens and p90 4,094).
# ALREADY SPENT, not a lever left to pull: UNSLOTH_CE_LOSS_N_CHUNKS is at 32
# (the notebook ships it). The qualified peaks above were measured at 16, so
# 32 buys real but unquantified extra margin.
# NOT on the ladder: use_gradient_checkpointing "unsloth" (CPU offload) - it
# is a no-op under DDP; unsloth PR#4240 states prior DDP fixes "eliminated
# CPU offloading entirely" for compatibility. That lever only does anything
# outside DDP.
#
# Watch-items (crash signatures with known one-line fixes):
#   - unsloth#3769: transformers >= 4.57.3 defaults
#     average_tokens_across_devices=True, which reportedly breaks the fused CE
#     backward under DDP ("'int' object has no attribute 'mean'"). All four
#     gates ran green on this exact stack (transformers 5.5.0), so we are
#     unaffected - but if a run crashes with that message, set
#     average_tokens_across_devices=False in build_sft_config.
#   - Never call FastModel.for_inference() pre-training without a matching
#     for_training(): it sets UNSLOTH_RETURN_LOGITS=1, silently re-materializing
#     ~2.3 GiB of fp16 logits per step at this seq/vocab.
#   - Pinned unsloth_zoo 2026.8.3 predates zoo PR#988 (2026-08-05): Kaggle
#     Dataset.map fork workers can be OOM-killed -> "One of the subprocesses
#     has abruptly died" at SFTTrainer construction. If hit, bump unsloth_zoo
#     >= 2026.8.4 in a scratch branch (do NOT bump this qualified lane).
#   - Step-0 asserts: tokenizer.pad_token == "<|endoftext|>" (unsloth#4104:
#     a <|vision_pad|> pad silently NaNs LoRA-A grads at batch > 1), and scan
#     the log for unsloth's masked-row drop notice - rows < 90% masked are
#     dropped with only a print(), not an error.
model:
  repo: unsloth/Qwen3-8B-unsloth-bnb-4bit
  revision: 62efd7f9d748e394734a7adae2adf96e13a2abc8
  instruction_part: "<|im_start|>user\n"
  response_part: "<|im_start|>assistant\n"

data:
  think_open: '<think>'
  think_close: '</think>'

lora:
  r: 32
  # Adapter scale is a DEAD KNOB on this lane - A/B'd to death 2026-08-10/11:
  # plain alpha 64 (2x, W&B 5rfnc3d1), rsLoRA alpha 32 (5.66x, wl5estcl) and
  # rsLoRA alpha 64 (11.3x, bh920zyh) all reproduce the baseline loss curve
  # within +/-0.05 per step; only gradient heat scales (~linearly with the
  # scale factor). Don't burn quota re-testing alpha/rsLoRA at r=32.
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  seed: 3407
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.001
  optim: adamw_8bit
  lr_scheduler_type: linear
  # Measured grad_norm runs 0.08-0.19 on this lane, so the transformers
  # default 1.0 clip never binds; 0.3 is the QLoRA-paper value and the only
  # clip that actually bounds an fp16 spike here.
  max_grad_norm: 0.3
  smoke:
    max_seq_length: 8192
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 2   # 8192 x 1 x 2 x 2 ranks = 32,768 tokens/step CEILING
    max_steps: 60
    save_steps: 25
    dataset: data/smoke_v1.jsonl
    # 0 = this run does not evaluate, so the smoke lane stays self-contained
    # (smoke_v1 has no held-out half). THE PROBE QUALIFICATION IS THIS LINE:
    # set it to 8 once the corpus is pushed and run PROBE before MAIN. An
    # eval forward materialises a [1, seq, 151936] logits tensor outside
    # unsloth's chunked-CE path, which moves the memory profile, and the
    # repo's rule is that any change to the profile goes through PROBE first.
    # Nothing in the code gates on the mode - this is the whole switch.
    eval_dataset: data/law_v1_eval.jsonl
    eval_rows: 0
  # The production run. ga=6, not packing: the 2026-08-09 audit verified
  # packing=True would NOT contaminate on this pinned stack (TRL bfd forces
  # padding-free, seq_lengths -> position_ids survive the collator because
  # unsloth_zoo skips its DataCollatorForSeq2Seq swap when packing is on, and
  # transformers 5.5 builds the block-diagonal mask from position_ids on
  # plain SDPA) - but it IS net-negative here: it forfeits SDPA's is_causal
  # fast path AND enable_gqa (8->32 KV-head expansion per layer), materializes
  # a 64 MiB bool mask, and pays 8192^2 attention over ~2,500-token segments.
  # At bs=1 the collator pads to the longest row IN THE BATCH (= the row
  # itself), so the unpacked lane wastes zero tokens on padding; packing's
  # only real benefit is the 3x gradient batch, and ga=6 buys exactly that
  # (~30k real tokens/optimizer step) at zero VRAM or kernel change.
  # save_steps counts OPTIMIZER steps, which at ga=6 hold 3x the micro-batches
  # a ga=2 step did - so it shrinks 25 -> 10, it does not grow. 50 would have
  # been hours between checkpoints on any reading.
  #
  # 224 s/optimizer step IS NOT A MEASUREMENT, and the ~37 min cadence read
  # off it is an UPPER BOUND rather than a prediction. It is 3 x 74.7 s, and
  # 74.7 s was measured on smoke_v1 - built from a fixed template, so every
  # row fills the 8192 bucket. The law corpus is drop-never-truncate: the
  # current build's stats.md reads p50 2288 / p90 5757 against that same
  # 8192, and at bs=1 the collator pads to the longest row in the batch,
  # which is the row itself. Attention is quadratic in that length and the
  # MLP linear, so a median step does substantially less work than the one
  # 74.7 s was timed on, and group_by_length keeps similar lengths together
  # rather than pairing a short row with a long one.
  #
  # So the real cadence is shorter than 37 min by an unknown factor, and
  # nothing in this repo can say by how much. Read s/step off session 1's
  # log and set this then - it is the same "measure first" entry as
  # max_grad_norm. The test asserts a BAND, not this number, so that setting
  # it is an edit here and not an edit here plus an edit there.
  # max_steps: 0 is a SENTINEL - sft.py refuses to train main on it. Derive
  # it FROM THE BUILD, not from a GPU session: read counts.train.kept out of
  # the assemble.json push.py ships beside the corpus, set
  # max_steps = kept // (bs * ga * 2), commit. That count is the rows the
  # trainer will load, because assemble.py measures every row against THIS
  # max_seq_length - through config.py, with the pinned tokenizer sft.py
  # feeds the trainer - and drops what does not fit rather than truncating.
  # Cross-check against post_filter_rows= in session 1's log, which is still
  # the number that decides: train_on_responses_only drops a fully-masked row
  # with only a print, so the manifest count is an upper bound (they agree in
  # practice - built_row guarantees the shape and the step-0 label_coverage
  # gate refuses an all-mask batch). check_resume_schedule then freezes
  # whatever session 1 trained with, for every later session.
  main:
    max_seq_length: 8192
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 6
    max_steps: 0
    save_steps: 10
    dataset: data/law_v1.jsonl
    # The held-out half of the SAME build, fetched from hub.dataset_repo at
    # the same pinned revision as the corpus above - split.py's disjointness
    # guarantee is per build, so two builds' halves can overlap freely.
    # 64 rows at bs=1 is ~2-4 min per eval, roughly 1-2% of a session, every
    # save_steps * 5. Raise it only after session 1's measured eval_runtime
    # and peak_vram_reserved_gb say the headroom is there.
    eval_dataset: data/law_v1_eval.jsonl
    eval_rows: 64

hub:
  # Private, and scoped to this base model + launch shape - a repo shared with
  # another training shape means silent last-push-wins clobbering and
  # cross-loading on --resume. The notebook re-homes the NAMESPACE per session
  # (see the re-home cell); the repo NAME here is the live contract.
  checkpoint_repo: tantan01/tuned-law-v1-qwen8b-ckpt-ddp
  # M5 (task 15 fix round 1): the pin handoff push.py -> training/scripts/
  # pin_dataset.py needs to be connected to the same repo push.py's own config
  # (data/configs/data_law_v1.yaml's push.repo_id) writes to, or pin_dataset.py has
  # nothing to pin.
  dataset_repo: tantan01/tuned-law-v1-data
