# law_v1 dataset-curation build config. This file is churn-heavy (API
# providers/models/limits change weekly) so it lives separately from the
# training config and only ever REFERENCES it (build.train_config) for
# anything the trainer owns - think tags, tokenizer pin, dataset path.
# Never duplicate those values here; src/tuned/data/config.py resolves them
# from the referenced training config at load time.

build:
  train_config: training/configs/law_v1_8b_ddp.yaml
  workdir: data/build
  target_total: 18000
  mvp_total: 10300
  mix: {grounded_synthesis: 0.60, curated: 0.16, replay: 0.24}
  overgeneration: 2.0
  held_out_frac: 0.10
  # history: prev_rep.md 3.7 (build.length_band.think_max) - the 2026-08-27
  # "STAYS 3000" fence, the deepseek 99-row and gpt-oss 1,281-row sweep
  # tables it rested on, the two SUPERSEDED notes that corrected its "lead
  # generator" framing, and the anti-rehearsal and F2 template notes.
  #
  # ONE FACT FROM THAT FENCE STILL BINDS AND STAYS HERE: this band and
  # generate.GENERATION_OUTPUT_TOKENS are DELIBERATELY DECOUPLED. The fence
  # was written when that constant was 4,000, priced against cerebras/
  # gpt-oss-120b's 4,096 max_output; it is 16,384 now, derived in generate.py
  # against the sole generator's own ceiling. The decoupling is why moving
  # think_max cannot silently re-price the fleet - and why the test that
  # pins the inequality is the thing that fails first if it ever could.
  #
  # think_max RAISED 3000 -> 4000 on 2026-08-28 (operator directive: strip
  # the gpt-oss-era calibrations, re-fit for deepseek). The "STAYS 3000"
  # fence this replaced (archived above) is superseded on ITS OWN terms -
  # both of the conditions it set are now met:
  #   * "the raise only becomes coherent again if a generator with a LARGER
  #     output ceiling leads routing.generator" - bai/deepseek-v4-flash
  #     (max_output 16384) is the SOLE routing.generator since the
  #     2026-08-28 operator directive above; the 4,096 cerebras ceiling that
  #     made the cost side incoherent no longer binds any routed generator.
  #   * the cost-side arithmetic was re-derived the same day, not ignored:
  #     GENERATION_OUTPUT_TOKENS moved 4000 -> 16384 (generate.py, the wire
  #     value the bai hook was already sending), so the worst-case gate-legal
  #     reply at think_max 4000 (~5,089 real tokens at the measured deepseek
  #     minimum 3.93 chars/token) is covered with 3x margin, and the pinning
  #     test converts at the deepseek-measured minimum rather than gpt-oss's
  #     4.24.
  # The benefit side was re-measured at n=1,086 (all 11 deepseek arms, not
  # the 99-row sweep the 2026-08-27 fence rested on): length_band pass
  # 42.1% -> 51.7% on irac_analysis and 50.8% -> 59.8% on summarization,
  # with the curve flattening past 4000 (4500 buys +2.3/+3.1pp more, 5000
  # +2.0/+1.0pp, while total_max-alone blockage grows) - and the median irac
  # trace (think_est 3,227) FAILED the 3000 ceiling, i.e. the old value
  # rejected this generator's typical deliberation, the same defect class
  # the verbatim_overlap 120 -> 500 re-fit closed the same day. This raise
  # also retires the F2 follow-up above: a summarization-specific band is
  # unnecessary once the shared ceiling stops binding the median trace
  # (post-F2 summarization clean 21.5% -> 44.3% jointly with the verbatim
  # re-fit). Evidence: prev_rep.md 2.5 (deepseek-recalibration).
  # gpt-oss's own failure mode (think < think_min at 29.7%) is a FLOOR
  # problem and is unmoved by this ceiling, exactly as the fence records.
  #
  # think_max RAISED 4000 -> 4500 on 2026-08-31, and this one is a RE-FIT IN A
  # CORRECTED CURRENCY rather than another move of the same dial.
  #
  # total_max is the 8192 TRAINING bucket - assemble.py drops an over-length
  # row outright (DROP_TOO_LONG, drop-never-truncate) against max_seq_length
  # 8192 - so it is a packing-admissibility test over the row the trainer
  # sees. That row's user turn is seed["text"] and nothing else
  # (decontaminate.py: "THE PROMPT IS THE GROUNDING, NOT THE RENDERED
  # TEMPLATE"). Until 2026-08-31 the gate was handed the whole rendered
  # message set instead, charging the persona and the craft instructions -
  # a fixed ~806 est tokens, 695 to 918 across the fourteen generator
  # templates - against a budget those bytes never occupy. Fixed in
  # generate.build_prompt; the gate thresholds were all fitted against the
  # inflated figure, so the ceiling had to be re-fitted with them.
  #
  # Swept over the 1,423 stored generations in the corrected currency,
  # disposition-clean (self_verification is DIAGNOSTIC and never blocks, so
  # it is excluded - the "12.2% clean" figure that counted it was measuring
  # something no row is rejected for):
  #
  #     think_max   4000    4500    5000    6000    8192
  #     deepseek   33.3%   37.0%   37.0%   37.0%   37.0%
  #     pooled     29.9%   30.0%   30.0%   30.0%   30.0%
  #
  # 4500 is where the curve stops: past it total_max binds instead, and at
  # 4500 ten of the twelve remaining deepseek length_band failures already
  # carry total>total_max. Buying more would mean a bigger bucket, which
  # seq 12288 (OOM, 2026-08-26) says is not available.
  #
  # deepseek baseline for comparison was 25.9% - the +11.1pp is the currency
  # fix (+7.4) and the ceiling (+3.7) together. POOLED barely moves because
  # 440 of the 577 length_band failures are gpt-oss's think<think_min, a
  # FLOOR failure on a generator that no longer runs; deepseek has zero of
  # them and fails only ceiling-side. Do not plan against the pooled profile.
  #
  # The cost side is unchanged: GENERATION_OUTPUT_TOKENS stays decoupled at
  # 16,384, and the worst-case gate-legal reply at think_max 4500 is ~5,598
  # real tokens at the measured deepseek minimum 3.93 chars/token - still
  # covered ~3x, and the inequality test is what fails first if it is not.
  length_band: {total_max: 8192, total_min: 300, think_min: 500, think_max: 4500, answer_min: 120}
  difficulty_target: {easy: 0.34, medium: 0.50, hard: 0.16}
  appointed_day: "2024-07-01"

# --------------------------------------------------------------------------
# The assembly tail: split.py -> assemble.py -> stats.py.
# --------------------------------------------------------------------------
# Thresholds live here so those modules read them instead of carrying magic
# numbers. What is ALREADY STATED - by `build:` above or by the training
# config this file references - is deliberately NOT repeated:
#
#   the eval fraction         = build.held_out_frac (0.10)
#   the v1.1-full mix targets = build.mix (60 / 16 / 24)
#   the length bucket         = the train config's train.main.max_seq_length
#
# A second copy of any of those is a fence that can silently disagree with the
# fencing, so split.py and stats.py read the originals through
# cfg.build.held_out_frac, cfg.assembly.targets() and cfg.max_seq_length.
assembly:
  # Which mix targets stats.py grades against when --profile is not passed.
  default_profile: v1.1-full

  # Extra mix profiles. v1.1-full is build.mix and MUST NOT be restated here -
  # config.py refuses a redefinition rather than letting two 60/16/24s drift.
  #
  # The MVP cut is synthesis-light BY CONSTRUCTION, not by preference: it ships
  # every row that needs no teacher plus whatever synthesis exists at the cut,
  # so its targets are DERIVED and not chosen -
  #
  #     replay    = target_total * build.mix.replay   = 4,320
  #                 (and 4,320 is exactly sum(replay.DEFAULT_COUNTS))
  #     curated   = target_total * build.mix.curated  = 2,880
  #                 (curated.py's C1 1,700 + the curated_c2 rewrite slice)
  #     synthesis = mvp_total - the two above         = 3,100
  #                 (the transition stream's ~1,100 + the 2,000-row core)
  #     ---------------------------------------------------------------
  #                                                     10,300 = mvp_total
  #
  # The shares below are those counts over build.mvp_total to four places, and
  # test_build_config recomputes them from build.mix/target_total/mvp_total so
  # a hand-edit here fails rather than quietly regrading the corpus.
  profiles:
    v1.0-MVP: {grounded_synthesis: 0.3010, curated: 0.2796, replay: 0.4194}

  # _prov.source -> the mix bucket the row counts toward. EXPLICIT, because
  # substring-guessing a bucket is how a stream silently changes size: an
  # unmapped source is a RED gate naming the source, never a default.
  #
  # A source is `dataset` or `dataset:subset` - replay.py builds
  # "HuggingFaceTB/smoltalk2:{sub}" from the upstream row's own `source`
  # column, so the subset half is open-ended and cannot be enumerated. The
  # lookup takes the whole string first and the part before the first ":"
  # second, so a subset CAN be mapped away from its dataset's bucket by naming
  # it in full here.
  #
  # The three bare names are generated streams (tasks.STREAM_MIX): _prov.source
  # for a generated row is the stream it was planned under. curated_c2 counts
  # as CURATED and not as synthesis - the 16% bucket is "curated legal", which
  # is what a teacher REWRITE of a real judgment is, and the plan sizes the
  # bucket at 2,880 against curated.py's 1,700 for exactly that reason.
  source_streams:
    synthesis: grounded_synthesis
    transition: grounded_synthesis
    curated_c2: curated
    L-NLProc/PredEx_Instruction-Tuning_Pred-Exp: curated
    opennyaiorg/aalap_instruction_dataset: curated
    169Pi/indian_law: curated
    open-thoughts/OpenThoughts-114k: replay
    nvidia/Nemotron-Post-Training-Dataset-v2: replay
    HuggingFaceTB/smoltalk2: replay
    GSMS-B/Indian-Legal-QA-BNS-BNSS-BSA: replay
    allenai/WildChat-4.8M: replay

  gates:
    # Mix tolerance in PERCENTAGE POINTS, not a ratio: "60% +/- 2pp" is
    # 58-62%, which is not what 2% of 60% would be.
    mix_tolerance_pp: 2.0
    # Reasoning-trace share, a hard floor from the plan.
    trace_floor: 0.80
    # The byte-exact empty-think band. Both ends are gates: too few and the
    # model never learns to emit the empty scaffold, too many and it learns to
    # skip reasoning. The ceiling is the trace floor's complement, not an
    # independent number: over the rows assemble.py EMITS, a kept row is
    # counted by exactly one of the two shares - `_prov.reasoning` true with a
    # real think block, or the byte-exact empty scaffold with the flag off -
    # because assemble.py drops the third shape as `reasoning_flag_mismatch`
    # (ASSEMBLE_VERSION 2; before it, the identity held only because every row
    # builder happened to keep the two in step). So the shares sum to 1 and a
    # ceiling above 1 - trace_floor would admit a corpus the hard floor then
    # rejects. The plan's 0.22 was ruled down to 0.20 for exactly that
    # (2026-08-16). The drop rule is pinned in test_build_assemble.py, the
    # identity end to end in test_build_stats.py, and config.py refuses a
    # floor/band combination that is unsatisfiable or leaves a dead band of
    # its own - so these three numbers cannot drift apart by hand-edit.
    empty_think_min: 0.18
    empty_think_max: 0.20
    # A tripwire on the chain, not a re-dedupe: dedupe.py already ran.
    dup_ceiling: 0.005
    # Zero tolerance - special-token markup in message content survives the
    # chat template and teaches the model to emit control tokens.
    markup: true
    # Every row must carry a non-empty _prov.license; push.py's card counts them.
    require_license: true
    # Rows in a new-code shape whose provenance is an old-code corpus. REPORT
    # ONLY by default: the shape is a regex over prose and the false-positive
    # direction costs real rows, so the number is published and the operator
    # decides. Flip to true once the count has been read once.
    cross_code_red: false
    # Which provenances count as pre-transition for the gate above, beside any
    # row carrying _prov.code_era == "ipc" outright.
    old_code_sources: [169Pi/indian_law]
    # The custody chain reaching all the way back to decontamination. stats.py
    # is the terminal instrument, so a missing link is red rather than a note.
    require_chain: true

# --------------------------------------------------------------------------
# transition.py - the s.358 grid.
# --------------------------------------------------------------------------
# The grid is NOT sized here and cannot be: it is one cell per
# (verified mapping row x date posture x procedural posture x question form),
# and the first factor is the operator's audit sheet
# (resources/ipc_bns_map.jsonl, verified_by). When the operator signs off the
# 17 rows that are still null the grid grows and nothing in this file changes.
# What is a CHOICE is how much of it is drawn.
#
# sample 1,100 is the plan's transition-stream size and is what
# assembly.profiles' derived v1.0-MVP synthesis share already counts
# (1,100 + the 2,000-row core = 3,100). eval_reserve 150 cells are chosen
# BEFORE the sample out of the same deterministic order, so the two sets are
# disjoint by construction rather than by a filter that could be forgotten -
# and reserved cells are marked held_out in the store, which is what keeps
# tasks.py from ever planning a teacher generation against the eval.
transition:
  sample: 1100
  eval_reserve: 150

# --------------------------------------------------------------------------
# calibrate.py - judge thresholds from human gold labels (P5).
# --------------------------------------------------------------------------
# GOLD LABELS ARE HUMAN-ONLY. Nothing in this block, and nothing in
# calibrate.py, may produce one: a model-written gold label would calibrate
# the judges against a judge, and the number that comes out would measure
# agreement rather than accuracy.
#
# 180 exported, 40 of them held out entirely, the remaining 140 split into 5
# folds of 28. min_recall/min_precision ARE the P5 gate from the plan:
# maximise precision subject to recall >= 0.60, then disqualify any judge
# whose holdout precision is under 0.75 and swap the next model in
# routing.judge into its slot.
calibration:
  pilot_export: 180
  holdout: 40
  folds: 5
  thresholds: [3, 4, 5]
  rules: [min_axis, mean, both]
  min_recall: 0.60
  min_precision: 0.75

# --------------------------------------------------------------------------
# difficulty.py - probe-calibrated length proxy (P9).
# --------------------------------------------------------------------------
# probe_sample is a CEILING on rows that ever reach the probe model, not a
# batch size. Per-row probing was costed at 32M tokens / 65 days on this
# corpus, so the design is one 1,000-row calibration pass that fixes the
# length bands and a pure length proxy for every row after it.
#
# The target mix is build.difficulty_target (0.34 / 0.50 / 0.16) and is NOT
# restated here - one definition, the same rule the eval fraction and the mix
# targets follow. mix_tolerance is how far the labelled corpus may sit from
# it before difficulty.py refuses the bands it just fitted.
difficulty:
  probe_sample: 1000
  mix_tolerance: 0.05

# --------------------------------------------------------------------------
# push.py: the HF dataset repo the training lane pins against (HubCfg.
# dataset_repo in training/configs/law_v1_8b_ddp.yaml, via
# training/scripts/pin_dataset.py - push.py's own job ends at "repo exists,
# revision printed").
# --------------------------------------------------------------------------
push:
  repo_id: tantan01/tuned-law-v1-data
  private: true

providers:
  # THE CEREBRAS max_context VALUES WERE WRONG BY 16x UNTIL 2026-08-19, and the
  # cost was paid entirely by this build. Both models were pinned at 8192 - a
  # figure nothing here ever measured. Its provenance is findable:
  # prev_rep.md 1 (data-strategy-research) tabulates cerebras as
  # "ctx capped 8,192" and adds "8k ctx matches the bucket", which is the
  # training sequence length of this build (8192) being read as the provider's
  # context window. Two different 8192s, conflated once in a research note and
  # then copied into the config as fact. The report is a dated record and is
  # left as it is; this block is the correction. Two live probes, one call
  # each, max_tokens 16, temperature 0:
  #
  #     2026-08-19  cerebras/gpt-oss-120b   prompt_tokens 13515   HTTP 200
  #     2026-08-19  cerebras/gemma-4-31b    prompt_tokens 10252   HTTP 200
  #
  # Both served a prompt well past the pin without complaint; the operator
  # console reports the real window as 131,072 for the pool.
  #
  # WHAT THE STALE PIN COST, so nobody re-tightens it on a hunch: with 8192 as
  # the generator window, undersized_families excluded the ONLY generator
  # family for any prompt over ~6.5k estimated tokens (the 8192 is compared
  # against est x CONTEXT_SAFETY_MARGIN 1.25). The provider was never the
  # constraint; the config was. The same pin on gemma closed the TIEBREAK route
  # for long rows.
  #
  # THE "85%" HAS A DENOMINATOR AND IT IS WORTH STATING, because the figure was
  # quoted for two commits without one. Counted over the statute_qa stream:
  #
  #     270  statute_qa tasks in total
  #     142  parked gen_unroutable          52.6% of all statute_qa
  #     123  disposition unroutable:generator  45.6% of all statute_qa
  #
  # The 85% was 123/145 - i.e. of the tasks that had REACHED a routing decision,
  # excluding the 125 still sitting at stale_prompt. That is a real number and
  # the right one for "of the rows we tried to route, how many did this pin
  # eat", but it is not 85% of the stream and should not be quoted as if it
  # were. Roughly 210 rows become newly routable; the rest were never blocked
  # by this.
  #
  # ANYONE LOWERING THESE AGAIN MUST PROBE FIRST, exactly as above, and record
  # the prompt_tokens and status here. A max_context in this file is a claim
  # about someone else's server, and this one went three rounds of review
  # without being checked.
  #
  # tpm STAYS 30,000, AND THE COMBINATION IS SAFE - checked rather than
  # assumed, because a 131k window against a 30k/minute budget looks like a
  # deadlock. providers.TokenBucket._need_tokens CLAMPS the charge to the
  # bucket's capacity, so a single call bigger than a whole minute's budget
  # degrades to "wait for a full bucket, then send" instead of waiting for a
  # level the bucket can never reach. Measured on the real TokenBucket with an
  # injected clock: est 131,072 against tpm 30,000 proceeds immediately on a
  # full bucket and after exactly one 60s refill on an empty one - one sleep,
  # no spin, no deadlock, and next_wait() agrees with acquire(). No per-call
  # ceiling is needed and none was added; the provider's own 429 handling with
  # backoff takes it from there.
  # b.ai, added 2026-08-25. Free tier, and the ONLY new FAMILY in this file:
  # everything else here is gpt-oss/gemma/qwen/mistral, so deepseek is the one
  # generator family that is not also sitting in the judge pool.
  #
  # THE RATE LIMIT IS A REQUEST-COUNTED BUCKET OF 10 - not a token budget and
  # not a concurrency cap. Measured three ways on 2026-08-25:
  #   * 24 requests back-to-back admitted 10; 24 fired simultaneously admitted
  #     12. A 17x difference in overlap moved the count by two, so it is NOT
  #     an in-flight cap.
  #   * ~41 req/min carrying only ~650 tok/min throttled, while ~4.5 req/min
  #     carrying ~4,700 tok/min ran clean. 7x the tokens passes and 9x the
  #     requests does not, so it is NOT token-weighted.
  #   * every saturating test admitted exactly ten, and recovery from a drained
  #     bucket to first success took 40.5 s.
  # REJECTED CALLS CONSUME SLOTS TOO: 15 deliberately-invalid requests drained
  # it and the next VALID call came back 429. That is why rpm is 8 and not 10.
  #
  # The corollary that matters for cost: a cheap call and an expensive call
  # consume the same one slot, so batching large prompts is free and chatty
  # small calls are the wasteful shape here.
  #
  # tpm IS DELIBERATELY ABSENT, and this comment is the fence against adding it
  # back. TokenBucket charges `context_est_tokens + max_tokens` per call
  # (generate.py est_tokens -> bucket.acquire), so a tpm here is a SECOND,
  # client-side limiter measured not to exist on the server. A tpm of 18000
  # against ~6,800 est-tokens per call refills for ~23 s and throttles this ref
  # to ~2.6 requests/min - one sixth of the real ceiling - and because acquire()
  # holds its lock across the wait, it serialises every worker behind it.
  # limits.get("tpm") returning None disables that dimension, which is exactly
  # what a request-counted bucket needs.
  #
  # tpd/rpd are OMITTED rather than guessed: no daily cap was reached across
  # ~4.6M tokens, and store._cap reads a missing cap as unlimited, which is the
  # honest state rather than a number nobody measured.
  #
  # max_context 800000 is inside a MEASURED bracket, not a claim: 844,701
  # prompt tokens returned 200 and 900,000 returned 400 "Input token exceed the
  # limit". The 18,752 figure in the first day's notes was never a context
  # measurement at all - it was the rate limiter interfering with the probe.
  #
  # reasoning_effort low IS A RELIABILITY SETTING, not a quality preference.
  # Reasoning is billed against max_tokens and emitted first, and the ladder
  # measures low 2,097 / high 4,300 / default 6,576 / max 12,573 tokens. At
  # default the call averages 73 s and at max 99.3 s - against a Cloudflare
  # origin timeout of ~100 s that killed 2 of 4 max-effort calls with HTTP 524.
  # SSE streaming fixes that completely (4/4, one running 172 s), but
  # ChatClient has no streaming path, so until it does, low is the setting that
  # finishes: 33.4 s per call, and still ~3x the reasoning trace that
  # gpt-oss-120b's 668 tokens produce.
  - name: bai
    base_url: https://api.b.ai/v1
    api_key_env: BAI_API_KEY
    quirks: [bai]
    models:
      - id: deepseek-v4-flash
        family: deepseek
        roles: [generator, judge, tiebreak]
        # max_output 16384 is a REPLY ceiling, not an answer ceiling: the bai
        # request hook raises a smaller caller budget up to it, because
        # reasoning is billed here and emitted first. 4096 measured 10/20 empty
        # on the real synthesis prompt; 12288 measured 0/4.
        limits: {rpm: 8, max_context: 800000, max_output: 16384}
        params: {temperature: 0.7, top_p: 0.95, reasoning_effort: low}
        # JUDGE SLOT B, from 2026-08-27. The seat was empty: cerebras/gemma-4-31b
        # returns HTTP 402 payment_required, verified by direct probe the same
        # day (so does cerebras/gpt-oss-120b), which leaves routing.judge with
        # one working free ref and makes the next candidate the PAID
        # openai/gpt-5-mini - reachable on any row family_separation does not
        # exclude it from. See the routing.judge comment.
        #
        # JUDGING IS THE OPPOSITE CASE to the reply ceiling above, and the
        # request hook already knows it: a judge call arrives with a
        # deliberately small budget (1,024) because a verdict is short, so
        # _bai_request_hook leaves a JUDGING_ROLES budget untouched instead of
        # raising it 16x into room to think. What a small budget CANNOT do is
        # stop the model thinking inside it - reasoning is billed against
        # max_tokens and emitted FIRST here, so a call that deliberates returns
        # a well-formed HTTP 200 whose content is empty and whose
        # finish_reason is "length". `thinking: disabled` is what stops that,
        # and it is scoped to the judging roles on purpose: the generator wants
        # the reasoning it is being paid for, and role_params is the only layer
        # that can say so for one role and not the other.
        #
        # MEASURED, not assumed - the ~90%-effective figure that `thinking:
        # disabled` carried from 2026-08-25 would be one empty reply in ten,
        # which is not a basis for a production judge seat. 21 real judge-role
        # calls on a 6,903-token judge prompt returned 20 parseable three-axis
        # verdicts; the one failure was this exact shape, 1,024 reasoning
        # tokens and no content. Suppression is PROBABILISTIC, not a switch -
        # three of the 21 thought anyway (637, 748, 1024 tokens), and when it
        # thinks it does not think a little. Do NOT try to fix the remainder
        # with `reasoning_effort: minimal`: that arm was run and measured WORSE
        # (7/10, three truncations), which is why `low` above is left alone.
        # prev_rep.md 2.3 (deepseek-as-judge-slot-b) has the run.
        #
        # temperature 0.2 IS THIS REPO'S JUDGE CONVENTION, not a tuning guess:
        # build_payload's own docstring states it (providers.py:955-959, "the
        # generator wants temperature 0.7 / top_p 0.95 and the judge wants
        # 0.2") and mistral-large-latest's tiebreak block below is the other
        # instance. It is needed HERE because `params` above sets 0.7 for the
        # generator and judge.py sends no per-call temperature at all, so
        # without this line every judge call inherits generator sampling.
        #
        # WHAT FORCED IT: the 2026-08-27 probe scored ONE unchanging candidate
        # 20 times and got (5,5,5) x12, (4,3,3) x3, (4,5,5) x2, (4,4,4),
        # (4,4,5), (5,4,5). That is not a tidiness problem - under a
        # `min_axis 4` rule the (4,3,3) draws REJECT the candidate the (5,5,5)
        # draws accept, so 3 of 20 draws flipped the decision on identical
        # input. The answer-rate below was measured at 0.7 and has NOT been
        # re-measured at 0.2; re-measuring is its own experiment.
        #
        # A KEY role_params CANNOT REACH: `reasoning_effort`. The merge is a
        # dict overlay (model.params < role_params[role] < req.params), so a
        # role layer can only set or override a key, never UNSET one. "thinking
        # disabled and no reasoning_effort key at all" is therefore not
        # expressible here at all, and it is the one arm never tried - `low`
        # asks for some reasoning while `thinking: disabled` asks for none, so
        # the pair may be why suppression measured ~82% rather than higher.
        # That is a HYPOTHESIS, untested: it would need a code-level change to
        # try, and nothing here establishes it.
        role_params:
          judge: {thinking: {type: disabled}, temperature: 0.2}
          tiebreak: {thinking: {type: disabled}, temperature: 0.2}
  - name: cerebras
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    quirks: [cerebras]
    models:
      - id: gpt-oss-120b
        family: gpt-oss
        roles: [generator]
        limits: {rpm: 5, tpm: 30000, tpd: 1000000, max_context: 131072, max_output: 4096}
        params: {temperature: 0.7, top_p: 0.95, reasoning_effort: medium}
      # zai-glm-4.7 (family glm, judge + tiebreak) IS GONE, and this comment is
      # the fence against re-adding it: the model is ARCHIVED upstream and every
      # call to it 404s -
      #
      #     {"type": "model_archived_error", "code": "model_archived",
      #      "message": "Model zai-glm-4.7 is archived and unavailable for the ..."}
      #
      # - measured 2026-08-18 on 4 slot-B routes, each of which spent one
      # eligible-model attempt on it before failing over (run_event
      # judge_route_error, status 404). A dead ref in a routing list is not
      # free: it is an attempt per route, on every route, forever. Anyone
      # putting a glm model back must first check it answers `python -m
      # tuned.data.providers --check --ref cerebras/<id>` with a 200.
      # max_context raised 8192 -> 131072 on the probe recorded at the top of
      # this provider block (prompt_tokens 10252, HTTP 200, 2026-08-19). This
      # one is the TIEBREAK route: at 8192 no long row could reach a third
      # family at all, so every tie on a full-length generation was undecidable
      # by construction rather than by pool composition.
      # PROMOTED TO JUDGE 2026-08-19, taking the seat mistral-small was
      # disqualified from. It is the least-bad evidence available: the design
      # review's hand-forensics found it the most accurate of the three judges
      # (it caught three qwen false positives - 391, 441, 470 - that literal
      # source comparison confirms), and calibration could not fit it only
      # because all 9 of its gold-labelled judgements landed in the holdout
      # fold, which is a sampling accident rather than a verdict on the model.
      # It keeps its tiebreak seat too; family separation is what stops it
      # breaking a tie it was party to, and that is enforced in judge.py, not
      # here.
      - id: gemma-4-31b
        family: gemma
        roles: [judge, tiebreak]
        limits: {rpm: 5, tpm: 30000, tpd: 1000000, max_context: 131072, max_output: 4096}
        params: {temperature: 0.2}
  - name: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    quirks: [groq]
    models:
      # REASONING OFF FOR THE JUDGE ROLE since 2026-08-18, because with it on
      # this model cannot return a verdict at all inside its reply budget.
      #
      # Measured: 7 slot-B calls, 7 parse failures, 7,168 completion tokens =
      # EXACTLY 1,024 each (judge.JUDGE_MAX_TOKENS), every reply cut mid-word
      # still inside an unclosed `<think>` that opened "Here's a thinking
      # process: 1. **Analyze User Input:** ...". Zero judgements, and the
      # tokens were billed. The trace is not a little too long for the budget;
      # it does not finish within it.
      #
      # `none` is Groq's documented value for this family (console.groq.com
      # /docs/reasoning and the /docs/api-reference entry for reasoning_effort:
      # "qwen3 models ... Set to 'none' to disable reasoning. Set to 'default'
      # or null to let Qwen reason."), live-probed 2026-08-18: HTTP 200, no
      # think tags anywhere in the reply, and the JSON verdict alone.
      #
      # WHY NOT KEEP THE REASONING AND RAISE THE CAP. Two independent reasons,
      # both arithmetic:
      #   * role_params CANNOT express a bigger cap. providers.build_payload
      #     merges params < role_params < per-call params and only THEN assigns
      #     `payload["max_tokens"] = req.max_tokens`, so judge.py's own cap
      #     overwrites anything named here.
      #   * tpm 6000 is below the call. The measured judge prompts on this row
      #     size were 4,914-5,661 routing tokens; with a 1,024 reply that is
      #     already 5,938-6,685 against a 6,000/minute bucket, which
      #     TokenBucket._need_tokens can only serve by clamping and waiting for
      #     a full bucket. A reply budget large enough to hold this model's
      #     trace would put slot B under one call per minute and still overrun.
      # `reasoning_format: hidden` and `parsed` (also documented for this
      # family) are no help either: they change where the trace is REPORTED,
      # not whether it is generated and billed against max_tokens.
      #
      # WHAT IT COSTS: a judge that does not deliberate before scoring. That is
      # the condition slot A already runs under - mistral-small-latest's
      # reasoning channel is opt-in and the judge role deliberately does not
      # opt in - and its verdicts on this wave were 237-411 characters, i.e.
      # ~59-103 tokens against the 1,024 cap. The rubric asks for three
      # integers and one sentence, not an essay.
      #
      # ROLE-SCOPED ON PURPOSE, even though `judge` is the only role this model
      # serves today. In `params` the same key would follow the model into a
      # generator promotion and silently produce a traceless generator, which
      # is exactly the pilot failure the mistral block above records.
      - id: qwen/qwen3.6-27b
        family: qwen
        roles: [judge]
        limits: {rpm: 30, tpm: 6000, tpd: 200000, rpd: 1000, max_context: 131072, max_output: 16384}
        params: {temperature: 0.2}
        role_params:
          judge: {reasoning_effort: 'none'}
      # Also the difficulty probe since 2026-08-17: Groq retired its llama chat
      # lineup (llama-3.1-8b-instant 404s; live models endpoint carries only
      # allam-2-7b, the gpt-oss pair and qwen3.6-27b). Calibration adapts its
      # bands to whatever spread this model produces; the calibration report is
      # the instrument that would expose solve-rate compression - revisit there,
      # not here. Probing is not judging, so sharing the generator's family is
      # not a separation concern.
      - id: openai/gpt-oss-20b
        family: gpt-oss
        # judge ADDED 2026-08-27 - see routing.judge below for why (the
        # deepseek-row slot B gap) and the 0/10 IPC->BNS caveat that comes
        # with it.
        roles: [judge, tiebreak, probe]
        limits: {rpm: 30, tpm: 8000, tpd: 200000, rpd: 1000, max_context: 131072, max_output: 65536}
        params: {temperature: 0.2}
  - name: mistral
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    quirks: [mistral]
    models:
      # MISTRAL-SMALL IS OUT OF THE JUDGE SEAT, AND THE FENCE IS ABOUT SMALL
      # SPECIFICALLY. `mistral-small-latest` was DISQUALIFIED as a judge by
      # human calibration on 2026-08-19, fitted on the operator's 46 gold
      # labels (10 accept / 36 reject, base rate 21.7%) -
      # data/build/gold/calibration_report.md:
      #
      #     fitted rule            mean>=3   (agreement 4/5 folds)
      #     HOLDOUT  n=40          precision 0.237   recall 1.000   phi 0.124
      #     cross-val n=6          precision 0.200   recall 1.000   phi 0.200
      #
      # The gate is precision >= 0.75. Precision 0.237 against a 21.7% base
      # rate is no information: the rule it fitted passes essentially
      # everything, which is exactly why recall is 1.000 and phi is 0.124.
      #
      # It corroborates the 2026-08-19 design review rather than repeating it:
      # over 46 judgements that model never awarded validity >= 4 (values
      # {2,3}, sd 0.48), emitted the single vector 5/3/4 on 59% of calls, and
      # correlated with the other judge at r=+0.22 on the deciding axis. Its 0%
      # pass rate was STRUCTURAL - the axis that decided its verdict could not
      # reach the passing value. While it sat in slot A its borderline verdicts
      # forced a wasted regeneration on 41% of rows and a paid tiebreak on 100%
      # of accepts: 101 judge calls bought 46 scored generations.
      #
      # THE FENCE DOES NOT COVER mistral-large-latest, which is a different
      # model on different weights and is UNPROVEN rather than disqualified.
      # Nothing here claims it is good.
      #
      # WHAT THE TIEBREAK SEAT ACTUALLY BUYS, stated exactly, because the first
      # version of this fence said it "will be measured the same way small was"
      # and that is not what the arithmetic supports. The seat earns gold-label
      # COVERAGE: it fires on 11 of 56 judged generations (20%), so its
      # verdicts do land in front of the operator. FITTING is a further step
      # and it needs labels OUTSIDE the holdout - and the seat's previous
      # occupant is the counter-example: gemma earned 9 gold labels and all 9
      # landed in the holdout fold, leaving ZERO fittable rows and a
      # DISQUALIFIED-for-no-data verdict that says nothing about the model. At
      # the current scale (46 labels, holdout 40) only 6 rows were fittable at
      # all, for any judge. So a real fit on this seat is realistic at GOLD
      # ROUND 2 SCALE (~180 labels), not before.
      #
      # Until then this is a bet with its evidence pending, and promoting it to
      # a judge slot before that evidence exists is the mistake this fence
      # records.
      #
      # LICENSING, recorded so the card's provenance story stays coherent:
      # mistral-large weights are NOT Apache-2.0 (small and magistral are). It
      # does not matter here and the reason is structural rather than a
      # concession - a judge contributes SCORES to this build, never text. The
      # open-weight requirement binds the GENERATOR, whose tokens are what ship
      # in the dataset; the bench is measurement apparatus. What does bind is
      # La Plateforme's output terms, which stay clean for this use (no
      # distillation restriction on the outputs we keep, and we keep only
      # integers and a rationale we never train on).
      #
      # THE PREDECESSOR NOTE, kept because it is why there is one block here:
      # the magistral line was retired upstream on 2026-07-31 and
      # `magistral-small-latest` no longer exists as a distinct model. The
      # generator block was deleted rather than re-pointed so two roles cannot
      # drift into two different aliases of the same weights again.
      #
      # THE FULL WORKSPACE BUCKET, and this is a restoration rather than an
      # increase. The workspace limit is 50 rpm / 50k tpm and the ledger below
      # records that BOTH mistral models drew on the ONE bucket; each was
      # therefore given half, because providers.TokenBucket is per
      # (provider, model) and two 50k buckets would have issued at twice the
      # real refill rate. With one model there is one bucket, so it gets the
      # whole workspace allowance.
      #
      # family stays `mistral` for both roles, which is what keeps
      # family_separation from letting this model judge its own generations.
      #
      # JUDGE ONLY since 2026-08-18. This model was promoted to generator when
      # the magistral line was retired, and the re-pilot measured the result:
      # over 56 generations it produced ZERO rows that passed the gates, and
      # 50 of the 56 (89%) failed irac_placement because it writes a NUMBERED
      # IRAC OUTLINE inside its reasoning and then fills it in -
      #
      #     '1. **Issue**: The core issue seems to be whether a partnership...'
      #     '2. **Rule**: The relevant legal provisions include:'
      #
      # - which is precisely the MSLR scripted-trace pathology this dataset is
      # built to avoid, and which cost -33.8% quality in the evidence that
      # bought the gate. The same run put cerebras/gpt-oss-120b at 9% on that
      # gate, so this is the model and not the prompts.
      #
      # THE EFFORT KNOB CANNOT FIX IT, probed live 2026-08-18: the API accepts
      # ONLY `reasoning_effort` of 'none' or 'high' (400 on 'medium'/'low',
      # error naming the enum ReasoningEffort.none | ReasoningEffort.high). So
      # the whole menu is outlining-at-high or traceless-at-none, and neither
      # serves a reasoning stream. Demoted rather than tuned.
      #
      # WHAT DEMOTION COSTS: prompts too long for the cerebras window have no
      # generator at all and park gen_unroutable, spending nothing. Measured at
      # the time as 3 of 100 pilot prompts, against an alternative of 3 billed
      # attempts each at an 89% failure rate - so the demotion was right.
      #
      # THAT 3% WAS AN ARTEFACT, and this is the correction rather than a
      # re-argument: those three prompts were "too long" only against the
      # stale 8192 pin, i.e. above 6,554 routing tokens. The probed window is
      # 131,072 and the cliff is 104,858, which no pilot prompt came within
      # two orders of magnitude of (measured range 1,445-2,799). The demotion
      # now costs approximately nothing rather than 3%.
      #
      # SAMPLING IS STILL PER ROLE. config.py refuses a role_params key naming
      # a role the model does not serve, so the key below tracks the role list
      # above; the mechanism is what keeps one role from inheriting another's
      # sampling if this model is ever given a second seat.
      #
      # LIMITS: ONE MEASUREMENT AND THREE FLOORS, labelled so nobody reads a
      # floor as a fact. This is the defect 8778800 fixed for cerebras, where
      # an unmeasured 8192 sat in this field for the life of the project and
      # unroutable'd 85% of a stream.
      #
      #   max_context 52812 IS A MEASUREMENT, and it is a FLOOR rather than the
      #   model's ceiling: probed 2026-08-19, one call, max_tokens 16,
      #   temperature 0 -> HTTP 200, prompt_tokens 52812, finish_reason stop.
      #   The vendor documents a larger window; this file records what was
      #   probed. It only has to clear required_context(worst-case tiebreak) =
      #   29,666, which it does by 78%.
      #
      #   rpm 2 / tpm 30000 / tpd 5000000 ARE FLOORS, NOT MEASUREMENTS. The
      #   free "Experiment" tier publishes no per-key figures worth pinning, so
      #   these are chosen for the ROLE's shape instead: the tiebreak fires on
      #   ~20% of judged rows, so a low rpm costs nothing. tpm is set above one
      #   whole tiebreak call (~24k prompt + 1k reply) on purpose - below it,
      #   TokenBucket clamps the charge to capacity and every call waits a full
      #   60s refill first, which is correct but needlessly slow.
      #
      #   tpd RAISED 500,000 -> 5,000,000, and the first value was a floor set
      #   too low to do the job. At ~24k tokens a worst-case tiebreak call,
      #   500k bought about 21 calls a day; draining the ~210 rows the cerebras
      #   probe made newly routable implies roughly 42. A floor that throttles
      #   the work it was sized for is not conservative, it is wrong in the
      #   expensive direction - the row waits and the ledger says "budget",
      #   which reads like a provider limit and is not one. 5,000,000 is still
      #   far under the published free-tier scale (order 1B/month) and is still
      #   a FLOOR, not a measurement.
      #
      # A usd_cap WAS ADDED HERE 2026-08-27 and REVERTED THE SAME DAY - kept
      # as history rather than deleted, because the trade it got wrong is
      # exactly the trade the next reviewer will be tempted to make again.
      # usd_cap: 0.0 plus usd_per_1m_prompt: 0.5 / usd_per_1m_completion: 1.5
      # (La Plateforme's published rate for Mistral Large, checked 2026-08-27)
      # made this ref permanently unroutable from its first call, the same
      # fenced shape as the openai backstops - and it was measured to remove
      # the ONLY live tiebreak candidate for EITHER generator family, since
      # cerebras/gemma-4-31b (the other tiebreak-eligible family on most rows)
      # is 402. The cap traded a low-probability tier-terms risk (this build
      # uses a tiny fraction of a ~1B-token/month free allowance) for a
      # certain, immediate one: every contested row on every generator family
      # loses its last tiebreak the moment the cap lands.
      #
      # WHAT MADE THE CAP LOOK RIGHT AT THE TIME was a probe that read
      # mistral as possibly dead - a 45s read-timeout, logged as
      # "inconclusive, not confirmed dead" in the comment that justified the
      # cap. A DIRECT PROBE AFTERWARD (not through the Router) corrected that:
      # attempt 1 read-timed-out at 180s, attempt 2 returned HTTP 200 in
      # 101.1s. providers._CALL_DEADLINE_S is 300.0, so a ~101s call fits
      # comfortably - mistral is SLOW, not unavailable, and the fleet's own
      # deadline already accommodates it. No cap belongs on a ref this build
      # cannot afford to lose and that is not, in fact, failing.
      #
      # ITS FREE STATUS STILL RESTS ON TIER TERMS RATHER THAN ON ANYTHING THIS
      # CONFIG ASSERTS, and that is unchanged by the revert - La Plateforme's
      # "Experiment" tier, not a usd_cap here, is what keeps this free. If
      # that ever needs enforcing again, the fix is not a blind $0 fence: it
      # is a cap large enough to clear this build's real usage (the tpd floor
      # above already reasons about that scale) rather than one that blocks
      # the first token.
      - id: mistral-large-latest
        family: mistral
        roles: [tiebreak]
        limits: {rpm: 2, tpm: 30000, tpd: 5000000, max_context: 52812, max_output: 8192}
        params: {}
        role_params:
          tiebreak: {temperature: 0.2}
  # The lightning (paid gpt-oss overflow) and openai (gpt-5-mini/nano paid
  # judge backstop) provider blocks were DELETED 2026-08-28 with the free-
  # fleet ruling: no paid ref anywhere. Their full blocks - measured limits,
  # spend-fence history and THE TRAP note - are archived verbatim in
  # prev_rep.md; re-adding any paid provider starts from there.

# Mistral rpm/tpm are console+header-verified 2026-08-14 and are no longer
# placeholders. The workspace limit is 50 rpm / 50k tpm and BOTH models draw
# on the ONE bucket: the remaining-tokens header decremented continuously
# across calls made with different models (50000 -> 49983 -> 49966), so the
# bucket is per WORKSPACE, not per model. providers.TokenBucket is per
# (provider, model), so each model is given half - two per-model buckets of
# 50k would issue at twice the real refill rate and 429-storm at full load.
# Cerebras is header-verified 2026-08-15 on a funded account ($5 credit):
# all three models answered 200, and the limit headers read rpm 5, tpm
# 30,000, 1,000,000 tokens/day and 2,400 requests/day PER MODEL. So the
# per-model treatment above was right, and the "may be account-wide,
# untested" caveat is retired rather than merely re-worded. Costing:
# pay-per-token at $0.35/$0.75 per 1M in/out on gpt-oss-120b, so the
# provider's own 1M tokens/day ceiling bounds the burn at roughly
# $0.55-0.75/day and the $5 credit covers the whole generation phase; the
# daily budget report is the instrument to watch it with. NOTE that the
# measured rpd 2,400 is NOT declared in the limits above, so store._cap
# reads requests/day as unlimited here and the tpd ceiling is the only thing
# ledgered - fine while tpd binds first, which at these rates it does.
# qwen/qwen3.6-27b is
# a Groq PREVIEW model and may vanish without notice - never make it the sole
# judge; the routing lists below always give fallbacks. Model refs in routing
# are "provider/model-id" strings - note that "groq/qwen/qwen3.6-27b" contains
# TWO slashes, so refs are split on the FIRST slash only (provider="groq",
# model="qwen/qwen3.6-27b").
#
# history: prev_rep.md 3.7 (providers - the fourth-family judge gap) - the
# 2026-08-15 note closing the fourth-family TODO against the openai backstop,
# and the 2026-08-27 correction retracting its "~$1/day cap". Both openai
# refs were deleted outright on 2026-08-28 with the free-fleet ruling. The
# bar they were measured against is not history, and is stated next.
#
# What made it qualify, and the bar any replacement must clear:
# max_context >= 29708. That is not a round number because it is not a
# preference - it is required_context(worst-case judge call), and the
# preflight prints the same number it enforces. In practice that means a 32k
# model. A 16k model is NOT enough - and that is worth saying because most
# free-tier candidates are 16k, and an under-sized judge does not fail
# loudly: the fleet starts, long rows pass the length gate, judge A is paid
# for, and the row parks. gpt-5-mini and gpt-5-nano declare 400k.
#
# Where the number comes from. The length gate passes a row whose prompt +
# trace + answer is at most 8192 chars/4 tokens, i.e. 32,768 characters, and
# the judge is shown a subset of that plus its own rubric. Sized in the
# ROUTING currency (providers.context_estimate: per-turn template overhead,
# and Indic script at 1.5 chars/token rather than 4) the largest judge call
# this build can produce is 23,767 tokens, and CONTEXT_SAFETY_MARGIN turns
# that into 29,708 of declared window. Devanagari is what makes it large,
# and this corpus is largely Devanagari.
#
# THIS NUMBER MOVED 29,661 -> 29,708 ON 2026-08-24 (judge-calibration Task 2),
# when the grounding_faithfulness rubric's bands were split to stop band 2
# swallowing band 3's territory - a prose-only change to judge_pointwise_v1
# that lengthened its longest axis line. Nothing about the judge pool or the
# length band moved; only the prompt got longer.
#
# history: prev_rep.md 3.7 (providers - the fatal slot-B gap) - what the
# fatal gap was and the arithmetic that made it a rule rather than an edge
# case, the 2026-08-27 note retracting "slot B is now openai/gpt-5-mini",
# the divert point (computed against the stale 8192 cerebras pin, two orders
# of magnitude away at the probed 131,072), the mistral-small fallback
# generator that left the build on 2026-08-19, and the reopen recipe for
# rows that parked before the fix. The divert MACHINERY is intact, so a
# future second generator family brings that arithmetic straight back.
#
# WHAT WAS LEFT IS NOW CLOSED, and it was closed by the max_context probe
# rather than by adding a model. The standing warning read: for a gpt-oss
# generation, separation removes every gpt-oss tiebreak (the groq 20b and both
# openai models, lumped into that family on purpose) and THE CONTEXT CHECK
# REMOVED GEMMA, which since the glm retirement was the only tiebreak family
# separation had left - so judge.py decided on two judges and rejected the
# unresolved disagreement (run_event tiebreak_unroutable_two_judge_decision).
#
# The context check removed gemma because gemma was pinned at 8192. It is not:
# probed 2026-08-19 at 10,252 prompt tokens, HTTP 200, and the pin is now
# 131,072. Measured on the real preflight, generate.preflight_messages over
# all three roles with every key present:
#
#     cerebras pinned 8192   0 refusals, 1 warning   (the tiebreak gap above)
#     cerebras at 131072     0 refusals, 0 warnings
#
# So the pool has no gaps at any row size this build can produce. The warning
# was never about pool composition - it was the stale pin, and it had been
# read as a fact about the fleet for three review rounds.
#
# IF IT COMES BACK - any edit to routing.tiebreak, or a model retirement -
# closing it takes one more tiebreak in a family that is none of
# gpt-oss/mistral/qwen/gemma, with max_context >= 29666. That number is
# UNCHANGED since the judge threshold above moved: this file never touched
# judge_tiebreak_v1, only judge_pointwise_v1. The two used to differ the
# other way - the tiebreak prompt a few tokens longer than the judge prompt,
# so 29,661 bought a judge and 29,666 a tiebreak - and the 2026-08-24
# grounding-band split reversed which one leads: 29,708 now buys a judge and
# 29,666 still buys a tiebreak, the preflight sizing the two separately
# either way.
#
# NOT an option: letting a judge share the generator's family when the pool
# runs out. Family separation is a data-quality invariant, not a preference.
#
# WHAT PREFLIGHT CANNOT SEE, recorded 2026-08-27 rather than fixed here.
# generate.preflight_messages(cfg, ["generator","judge","tiebreak"]) returns
# ([], []) - no warnings - on this shipped config, because it builds a
# BUDGET-BLIND Router: it checks family/context eligibility only, the same
# checks Step 2's pool-membership script above runs. It has no idea that
# openai/gpt-5-mini and openai/gpt-5-nano carry usd_cap: 0.0, or that
# cerebras/gemma-4-31b and cerebras/gpt-oss-120b are currently answering
# HTTP 402. So a fenced-to-zero or 402'd ref reads to preflight as a slot
# that IS filled, when in the fleet it is a slot that CANNOT be filled - a
# clean preflight here is not evidence of a healthy pool, only of a pool
# that is shaped correctly on paper. Confirming a slot can actually be
# bought requires the kind of live probe Step 2's report and this file's
# HTTP 402 notes above are built from, not preflight. Changing preflight to
# see budget or liveness is a separate change, with its own validation, and
# is deliberately not made here.
routing:
  # ONE generator since 2026-08-18 - see the mistral block for the measurement
  # that removed the second. A prompt too long for this model's window has
  # nowhere to go and parks gen_unroutable without spending, which is why the
  # window's declared value is load-bearing and why it is now probed rather
  # than assumed: at the stale 8192 pin that cliff sat at 6,554 routing tokens
  # and swallowed 85% of the statute_qa stream; at the probed 131,072 it sits
  # at 104,858, against pilot prompts of 1,445-2,799. See the cerebras block.
  # history: prev_rep.md 3.7 (routing.generator - the free-before-paid
  # order) - the cost-ordering policy for a list with two entries, the
  # one-family-two-providers note, deepseek's 2026-08-25 promotion and
  # 2026-08-27 demotion, the 2026-08-27 removal of the uncapped paid
  # lightning ref, and the three SUPERSEDED notes that retired the "ref 1 /
  # ref 2" numbering. None of it describes this list, which has one entry.
  #
  # OPERATOR DIRECTIVE, 2026-08-28: bai/deepseek-v4-flash is the SOLE
  # generator now. cerebras spends only on judging from here on
  # (cerebras/gemma-4-31b, judge slot B) - not generation - because the
  # cerebras account is now metered (~$4.63 remaining, ~8M tokens as of
  # today) and the operator wants that balance spent on judging.
  #
  # history: prev_rep.md 3.7 (routing.generator - the measured yield basis)
  # - the same-template comparisons in which gpt-oss out-yields deepseek on
  # every pairing, and the uncertainty in deepseek's own shipped-template
  # figure. It is archived rather than deleted because it is the evidence
  # for the sentence below: the flip was NOT a yield decision.
  #
  # THE FLIP IS THEREFORE AN ALLOCATION DECISION, NOT A YIELD DECISION.
  # Nothing measured above shows deepseek out-generating gpt-oss under any
  # template version; what decides it is that cerebras is now a metered
  # account (~$4.63 remaining, ~8M tokens - on the order of 1k rows of a
  # 15-20k-row corpus) and the operator directed that balance to judging
  # only (2026-08-28, see the operator directive above). A generator that
  # cannot fund more than a small fraction of the corpus cannot be primary
  # regardless of its per-row yield.
  #
  # history: prev_rep.md 3.7 (routing.generator - the prompt-ceiling
  # precondition) - the fix-round-1 correction of a mis-cited A/B, the
  # honest caveat that the 286fd3a prompt-ceiling edit is what dethroned
  # gpt-oss, and the note recording that the edit was reverted the same day.
  # NET EFFECT, WHICH IS WHY IT IS SAFE TO MOVE: gpt-oss's prompt-ceiling
  # precondition is SATISFIED, and routing is unchanged by it anyway - the
  # sole-generator directive above is an allocation decision, independent of
  # whether gpt-oss qualifies on prompts.
  #
  # THE CONSEQUENCES:
  # (a) A single generator ref means no failover: a bai breaker trip now
  #     parks rows rather than moving to a second ref, because there is no
  #     second ref - the same intended trade already recorded above when
  #     lightning was removed.
  # (b) Every row is now deepseek-family, so family_separation excludes
  #     bai/deepseek-v4-flash from routing.judge and routing.tiebreak on
  #     EVERY row - it stays routed in both lists but is DORMANT there until
  #     a second generator family returns.
  generator: [bai/deepseek-v4-flash]
  # JUDGE: qwen then gemma, the two free families, then the free gpt-oss
  # backstop. Every generation is deepseek family since 2026-08-28, so
  # family_separation excludes bai/deepseek-v4-flash from this list on every
  # row and the two slots that fill are qwen (A) and gemma (B).
  # history: prev_rep.md 3.7 (routing.judge) - the paid-backstop ordering
  # this replaced, and the note retiring its "on a gpt-oss generation" case.
  #
  # SLOT B WAS EMPTY on 2026-08-27: cerebras/gemma-4-31b answers HTTP 402
  # payment_required, verified by direct probe that day, as does
  # cerebras/gpt-oss-120b. That leaves qwen as the only working free judge, and
  # the ref the pool reaches for slot B is then openai/gpt-5-mini - a PAID
  # model. family_separation is not a guard against that in general: it
  # excludes the GENERATOR's family, so it hides the openai refs on a gpt-oss
  # row and not on any other. bai/deepseek-v4-flash goes in ahead of them
  # because it is free, it is a family no other judge here holds, and the
  # 2026-08-23 live drain that stalled with 34 judge_error was exactly this
  # gap. It sits AFTER gemma so a revived free ref is still preferred, and
  # BEFORE the paid refs because free-before-paid is the standing rule.
  # Its judge params disable thinking - see the bai provider block; without
  # that a 1,024-token verdict budget is spent reasoning and comes back empty.
  #
  # groq/openai/gpt-oss-20b ADDED 2026-08-27, for the gap the paragraph above
  # does not cover: on a DEEPSEEK-generated row, family_separation excludes
  # deepseek itself from this pool, leaving cerebras/gemma-4-31b (HTTP 402,
  # same probe as above) and the two fenced openai refs (usd_cap: 0.0,
  # unreachable by design) - slot B was one candidate deep and that candidate
  # was dead, so every deepseek row parked in judge_error after 8 attempts.
  # groq/openai/gpt-oss-20b is free, alive (probed 2026-08-27), and family
  # gpt-oss - not excluded on a deepseek row - so it fills the gap. It already
  # sits in routing.tiebreak and routing.probe.
  #
  # AVAILABILITY IS A SEPARATE QUESTION FROM FAMILY, AND IT DOES NOT HOLD HERE
  # (found by review, 2026-08-27). On a deepseek row the two LIVE judges -
  # groq/qwen/qwen3.6-27b (slot A) and groq/openai/gpt-oss-20b (slot B) - are
  # BOTH keyed by GROQ_API_KEY, one provider's limits. The family invariant
  # this addition exists for holds (two DIFFERENT families fill the two
  # slots); the AVAILABILITY invariant does not: withholding GROQ_API_KEY, or
  # groq itself going down, leaves a deepseek row with ZERO live judges, not
  # one. test_blocking_key_envs_names_only_keys_that_would_change_something
  # already encodes this shape - excluding only {"qwen"} no longer proves
  # GROQ_API_KEY is harmless, {"qwen", "gpt-oss"} is what it now takes. Not
  # fixed here, only recorded, the same way the slot-B gap itself was
  # recorded before this ref closed it.
  #
  # IT SCORED 0/10 ON IPC->BNS GROUND TRUTH - see routing.tiebreak below,
  # where it echoes IPC section numbers back as BNS ones - which is exactly
  # why tiebreak places mistral ahead of it: that ordering keeps it out of
  # the seat that decides a contested row outright. Here it is not that seat:
  # as judge B it is one of two independent opinions, not a decider, and a
  # disagreement with judge A still goes to the tiebreak pool (mistral
  # first) rather than resting on this verdict alone.
  #
  # THE CONTESTED-ROW CONSEQUENCE, RECORDED RATHER THAN FIXED (found by
  # review, 2026-08-27; corrected 2026-08-27 - the first version of this
  # paragraph described a REJECT that the code does not do). After judges
  # qwen and gpt-oss-20b, routing.tiebreak's exclusion set is {deepseek,
  # qwen, gpt-oss} - which removes groq/openai/gpt-oss-20b itself,
  # bai/deepseek-v4-flash, and both openai refs (family gpt-oss by
  # deliberate lumping) - leaving [mistral/mistral-large-latest,
  # cerebras/gemma-4-31b]. gemma answers HTTP 402. mistral is ALIVE - direct
  # probe 2026-08-27, HTTP 200 in 101.1s against the 300s call deadline, see
  # the mistral provider block - so on a live fleet this seat is normally
  # reachable and this paragraph is not describing today's typical outcome.
  #
  # WHAT ACTUALLY HAPPENS IF MISTRAL IS ALSO UNREACHABLE, because the pool
  # still has to survive that: judge.py's tiebreak_unroutable_two_judge_
  # decision path (the clean "reject the unresolved disagreement" path) only
  # fires when unroutable is True, and unroutable requires every skip to be
  # `context_exceeded` or `family-excluded` (generate.ROW_SHAPED_SKIPS;
  # generate.py's ROW_SHAPED_SKIPS = frozenset({"family-excluded"})). A
  # provider that is genuinely tried and fails - a timeout, a 402, an
  # over-budget block - is not a row-shaped skip, so unroutable stays False.
  # The row RE-QUEUES instead of rejecting, and burns another attempt on the
  # next pass; at MAX_JUDGE_ATTEMPTS (8) it parks in judge_error - the same
  # shape as the 2026-08-23 live-drain stall, not a clean, cheap reject. This
  # is NOT conservative or non-fatal: it costs up to eight judge passes per
  # row before the operator sees it. Recording it rather than fixing it is
  # this file's own standing rule.
  #
  # THE OPEN RISK, STATED PLAINLY: the 0/10 score was measured on UNGROUNDED
  # recall - reciting BNS section numbers from parameters, with no source
  # text in front of it. Judging is GROUNDED - the model is shown the source
  # text and asked to check the answer against it, not recite from memory -
  # so the measured failure mode may not transfer to the judge role. THAT IS
  # A HYPOTHESIS, NOT A MEASUREMENT: no calibration of gpt-oss-20b AS A JUDGE
  # has been run. Placed last among the free refs, immediately before the
  # paid backstops, so any revived or already-trusted free ref is still
  # chosen ahead of it.
  # The two openai/gpt-5-* refs that used to close this list (fenced to $0,
  # unreachable by design) were DELETED 2026-08-28 with their provider block
  # - free fleet only. See prev_rep.md for the blocks and the fence history.
  # THE PREFIX TRAP, and it outlived the refs that made it matter:
  # `groq/openai/gpt-oss-20b` is a GROQ ref whose MODEL id begins "openai/".
  # Any future filter that drops paid refs by prefix must key on the PROVIDER
  # segment, not on `startswith("openai/")` - the latter quietly empties both
  # this list's last slot and tiebreak's second, and every rule about a pool
  # that runs out then passes for a reason nobody chose.
  judge: [groq/qwen/qwen3.6-27b, cerebras/gemma-4-31b,
          bai/deepseek-v4-flash, groq/openai/gpt-oss-20b]
  # TIEBREAK: mistral sits third, ahead of the paid backstops and behind the
  # two free families that separation will usually have spent already. On a
  # gpt-oss row judged by qwen and gemma the exclusion set is
  # {gpt-oss, qwen, gemma} and mistral is the ONE family left - which is what
  # keeps the third opinion free rather than paid.
  # REORDERED 2026-08-25, and ONLY because the generator changed. The list
  # above was written when every generation was gpt-oss: the exclusion set was
  # {gpt-oss, qwen, gemma}, gpt-oss-20b was excluded on every row, and mistral
  # was the one family left. Listing gpt-oss-20b first cost nothing because it
  # never won.
  #
  # On a DEEPSEEK generation the exclusion set is {deepseek, qwen, gemma} and
  # gpt-oss-20b is suddenly ELIGIBLE AND FIRST - so the seat silently changed
  # hands. That seat is not an ordinary vote: with three verdicts the tiebreak
  # decides outright (judge_policy.resolve), so it would have handed every
  # contested row to the family measured at 0/10 on IPC->BNS mapping, which
  # states the BNS has 447 sections and that S103 is perjury.
  #
  # mistral first restores the model that actually held this seat. gpt-oss-20b
  # stays ahead of the paid backstops because it still has one job it alone can
  # do: mistral's probed window is 52,812, so on a row longer than that
  # undersized_families removes mistral and 20b's 131,072 is what stops the
  # tiebreak pool emptying.
  # MISTRAL STAYS FIRST, and it is load-bearing rather than tidy: every
  # contested row is deepseek-generated, so this ordering is what keeps
  # every tiebreak off groq/openai/gpt-oss-20b, the family measured 0/10 on
  # IPC->BNS mapping. Do NOT "tidy" this to gpt-oss-20b-first.
  # history: prev_rep.md 3.7 (routing.tiebreak) - the 2026-08-27 reasoning
  # that reached the same conclusion from a two-ref generator list, and the
  # note correcting its "minority of rows" framing to all rows.
  #
  # deepseek added 2026-08-27 with the judge seat, same reasoning and same
  # placement rule: after the free refs, ahead of the paid ones. It cannot
  # break a tie it was party to - family_separation removes the generator's
  # family and both judged slots' families before this list is walked - so on
  # a deepseek-generated row, or one deepseek already judged, it is not here.
  tiebreak: [mistral/mistral-large-latest, groq/openai/gpt-oss-20b,
             cerebras/gemma-4-31b, bai/deepseek-v4-flash]
  probe: [groq/openai/gpt-oss-20b]
  family_separation: true
  # audit since 2026-08-29: one groq key caps the dual fleet at ~35-40
  # decided rows/UTC-day (qwen + gpt-oss each tpd 200k vs ~5.5k-token judge
  # calls), which cannot keep pace with generation. In audit mode only a
  # hash-sampled fraction of rows (judge --audit-sample) buys
  # the dual treatment; the rest are accepted on gates with disposition
  # "audit:gate-accept", and the sample's accept rate is the batch's quality
  # evidence. Flip back to dual when judge capacity returns.
  judge_mode: audit       # dual | audit
  # A COLLAPSE detector, NOT a quality target. assemble's run refuses to push
  # (actions_worker._audit_collapse_refusal) when the dual-judged sample has
  # at least 50 decided rows AND the Wilson score interval's UPPER bound on
  # its accept rate is below this floor - the certain case, not the point
  # estimate, so a small unlucky sample cannot fail a build on noise.
  #
  # 0.20 is not fitted, and cannot be: judge_threshold is empty (calibrate.py
  # has never run against a legitimate gold set), and the only accept-rate
  # figure this pipeline has ever measured - 30.4% - is 56 verdicts from
  # BEFORE audit mode shipped, decided by a provider since retired, so it
  # cannot found a threshold either. What 0.20 actually asserts: even in the
  # best case a >=50-row sample is consistent with, an accept rate this low
  # means the sample is telling us almost nothing is acceptable - a dead
  # judge fleet, a broken prompt template, a routing regression - not that
  # the corpus is merely mediocre. A healthy build should sit far above it;
  # if this floor ever actually trips, look at the judge fleet and the
  # routing config before doubting the corpus.
  judge_collapse_floor: 0.20
  # When audit mode began - the commit that shipped it (732557c,
  # 2026-08-29T01:47:03+05:30), in store.utcnow's format so it compares as a
  # plain string against judgement.created_at. The collapse gate and the
  # operator readout both restrict the dual-judged sample to judgements at or
  # after this, because everything older was decided under the DUAL regime by
  # a fleet since retired.
  #
  # Leaving it null pools both eras, and NOT harmlessly: verify.py's armed cut
  # rewrites an off-teacher row's disposition out of `judge:%` when it sits in
  # accepted/judging, but never touches a `rejected` row - so pooling drops the
  # old ACCEPTS and keeps the old REJECTS, depressing the rate and making a
  # false collapse refusal more likely. Set it forward, never back, if audit
  # mode is ever restarted against a new fleet.
  judge_mode_since: "2026-08-28T20:17:03.000000Z"
